name: full-stack-ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: hms_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d hms_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://admin:password123@localhost:5432/hms_core
      DOCS_GOVERNANCE_STRICT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment Profile Security Preflight
        run: ./scripts/check-env-profile-security.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: OpenAPI Route Alignment
        run: ./scripts/check-openapi-alignment.sh

      - name: OpenAPI Changelog Contract Gate
        run: ./scripts/check-openapi-changelog.sh

      - name: Legacy Schema Convergence
        run: ./scripts/check-legacy-schema-convergence.sh

      - name: Validation Governance Docs Gate
        run: ./scripts/check-validation-governance.sh

      - name: RBAC Drift Gate (FE/BE)
        run: ./scripts/check-rbac-drift.sh

      - name: Backend Unit Gate (fmt/clippy/lib/contract)
        run: ./scripts/ci-backend.sh

      - name: Backend Integration Gate (sqlx)
        run: ./scripts/ci-backend-integration.sh

      - name: Security Regression Tests (AuthZ + CSRF/AuthN)
        run: ./scripts/backend-security-regression.sh

      - name: QA Core Journeys Gate (HMS-QA-010)
        run: ./scripts/qa-core-journeys.sh

      - name: Observability Smoke Gate
        run: ./scripts/observability-smoke.sh

      - name: Backend Coverage Threshold Gate
        env:
          HMS_COVERAGE_STRICT: "true"
          HMS_AUTO_INSTALL_LLVM_COV: "true"
          HMS_COVERAGE_AUTH_MIN: "70"
          HMS_COVERAGE_BOOKING_MIN: "45"
          HMS_COVERAGE_TENANT_MIN: "45"
        run: ./scripts/backend-coverage-threshold.sh

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional
        working-directory: frontend

      - name: Frontend Runner Preflight (Rollup optional fallback)
        run: ./scripts/frontend-runner-preflight.sh

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Tests
        run: npm run test -- --run
        working-directory: frontend

      - name: Build (includes Typecheck)
        run: npm run build
        working-directory: frontend

      - name: Frontend Performance Budget Gate
        run: ./scripts/frontend-perf-budget.sh

  e2e-browser:
    name: E2E Browser Core Journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=optional
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell
        working-directory: frontend

      - name: Start synthetic E2E stack
        run: |
          docker compose up -d db backend frontend
          for _ in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U admin -d hms_core >/dev/null 2>&1 && \
              curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Synthetic E2E stack did not become ready" >&2
          docker compose ps
          exit 1

      - name: Seed synthetic E2E data
        run: ./scripts/seed-demo-data.sh

      - name: Run E2E Core Journeys
        env:
          # The backend CI profile bootstraps this synthetic admin credential;
          # make the browser gate independent of per-spec local defaults.
          E2E_USERNAME: admin
          E2E_PASSWORD: admin123
        run: bash ./scripts/qa-core-journeys-e2e.sh

      - name: Run E2E Reception Lifecycle on Mobile Widths
        env:
          E2E_USERNAME: admin
          E2E_PASSWORD: admin123
          E2E_GREP: "guest lifecycle: walk-in, check-in, charge, payment, checkout and room release"
        run: |
          for width in 375 390 430; do
            echo "==> Reception lifecycle mobile width: ${width}px"
            E2E_VIEWPORT_WIDTH="$width" bash ./scripts/qa-core-journeys-e2e.sh
          done

  perf-smoke:
    name: Performance Smoke Gate
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start backend stack
        run: docker compose up -d db backend

      - name: Wait for backend
        run: |
          for _ in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready on http://localhost:3001/health" >&2
          exit 1

      - name: Run performance smoke baseline (HMS-QA-011)
        run: |
          ./scripts/perf-baseline.sh \
            --requests 8 \
            --concurrency 2 \
            --warmup 1 \
            --slo-p95-sec 1.0 \
            --slo-error-rate 0.05 \
            --fail-on-slo \
            --report /tmp/perf_baseline_ci.md
          cat /tmp/perf_baseline_ci.md

      - name: Stop backend stack
        if: always()
        run: docker compose stop backend db

  ci-stability-guard:
    name: CI Stability Guard
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-browser, perf-smoke, secret-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate CI Stability Thresholds
        # Historical stability is reported on pull requests but enforced on
        # protected branch pushes. A repaired commit must be judged by its
        # deterministic gates rather than blocked by its own repair history.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/ci-stability-report.sh \
            --runs 20 \
            --min-success-rate 0.50 \
            --min-consecutive-success 3 \
            --fail-on-threshold \
            --output /tmp/ci_stability_report.md
          status=$?
          set -e
          cat /tmp/ci_stability_report.md
          exit "$status"
