name: full-stack-ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: hms_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d hms_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://admin:password123@localhost:5432/hms_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: OpenAPI Route Alignment
        run: ./scripts/check-openapi-alignment.sh

      - name: Legacy Schema Convergence
        run: ./scripts/check-legacy-schema-convergence.sh

      - name: Backend Unit Gate (fmt/clippy/lib/contract)
        run: ./scripts/ci-backend.sh

      - name: Backend Integration Gate (sqlx)
        run: ./scripts/ci-backend-integration.sh

      - name: Security Regression Tests (AuthZ + CSRF/AuthN)
        run: ./scripts/backend-security-regression.sh

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional
        working-directory: frontend

      - name: Frontend Runner Preflight (Rollup optional fallback)
        run: ./scripts/frontend-runner-preflight.sh

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Tests
        run: npm run test -- --run
        working-directory: frontend

      - name: Build (includes Typecheck)
        run: npm run build
        working-directory: frontend

  ci-stability-guard:
    name: CI Stability Guard
    runs-on: ubuntu-latest
    needs: [backend, frontend, secret-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate CI Stability Thresholds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/ci-stability-report.sh \
            --runs 20 \
            --min-success-rate 0.50 \
            --min-consecutive-success 3 \
            --fail-on-threshold \
            --output /tmp/ci_stability_report.md
          cat /tmp/ci_stability_report.md
