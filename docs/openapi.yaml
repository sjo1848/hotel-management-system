openapi: 3.0.3
info:
  title: HMS Elite API
  version: 1.0.0
  description: API v1 para HMS Elite (auth, rooms, bookings, guests, users).
servers:
  - url: http://localhost:3001
    description: Local development
security:
  - cookieAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      summary: Refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: Logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/me:
    get:
      summary: Datos del usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms:
    get:
      summary: Listar habitaciones
      responses:
        "200":
          description: Lista de habitaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear habitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Habitación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/available:
    get:
      summary: Buscar disponibilidad
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Habitaciones disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/{id}:
    get:
      summary: Obtener habitación por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Habitación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      summary: Actualizar habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: Habitación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/{id}/holds:
    get:
      summary: Listar bloqueos de una habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bloqueos de la habitación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomHold"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear bloqueo temporal de habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomHoldRequest"
      responses:
        "201":
          description: Bloqueo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomHold"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/holds/board:
    get:
      summary: Listar bloqueos de habitaciones por rango
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Bloqueos del rango consultado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomHoldBoardEntry"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/{id}/holds/{hold_id}:
    patch:
      summary: Actualizar bloqueo temporal de habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: hold_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomHoldRequest"
      responses:
        "200":
          description: Bloqueo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomHold"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Eliminar bloqueo temporal de habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: hold_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bloqueo eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings:
    get:
      summary: Listar reservas
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "200":
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/front-desk/board:
    get:
      summary: Tablero operativo unificado de recepcion
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen operativo para front desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrontDeskBoard"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}:
    patch:
      summary: Actualizar reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/guests:
    get:
      summary: Listar huéspedes
      responses:
        "200":
          description: Lista de huéspedes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear huésped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRequest"
      responses:
        "200":
          description: Huésped creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/users:
    get:
      summary: Listar usuarios (admin)
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear usuario (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/users/{id}:
    delete:
      summary: Eliminar usuario (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/hotels:
    get:
      summary: Listar hoteles (SaaS)
      responses:
        "200":
          description: Lista de hoteles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hotel"
    post:
      summary: Crear hotel (SaaS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHotelRequest"
      responses:
        "200":
          description: Hotel creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/hotels/network-kpis:
    get:
      summary: KPIs consolidados multi-hotel (HQ)
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen consolidado HQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelNetworkSummary"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/hotels/{id}/plan:
    patch:
      summary: Actualizar plan comercial de un hotel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHotelPlanRequest"
      responses:
        "200":
          description: Feature flags del hotel actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantFeatureFlags"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/feature-flags:
    get:
      summary: Feature flags del tenant actual por plan
      responses:
        "200":
          description: Flags de capacidades habilitadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantFeatureFlags"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/{id}/status:
    patch:
      summary: Actualizar estado de habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/bulk-status:
    post:
      summary: Actualizar estado operativo de varias habitaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateRoomStatusRequest"
      responses:
        "200":
          description: Estados masivos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRoomStatusUpdateResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}/extra-charges:
    get:
      summary: Listar cargos extra por reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cargos extra
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtraCharge"
    post:
      summary: Agregar cargo extra a reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExtraChargeRequest"
      responses:
        "200":
          description: Cargo extra agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraCharge"
  /api/v1/analytics/kpis:
    get:
      summary: KPI de dashboard
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"
  /api/v1/audit/events:
    get:
      summary: Eventos de auditoría recientes del tenant
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Eventos de auditoría recientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /api/v1/billing/balance:
    get:
      summary: Balance actual de caja
      responses:
        "200":
          description: Balance actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingBalance"
  /api/v1/billing/closures:
    get:
      summary: Listar cierres de caja
      responses:
        "200":
          description: Cierres recientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashClosure"
  /api/v1/billing/close-cash:
    post:
      summary: Arqueo, cierre de caja y handoff de turno
      description: >-
        Cierra la ventana iniciada en el cierre anterior o en el primer cobro.
        Los campos de arqueo son aditivos; si se omiten, se conserva el
        comportamiento legacy usando el efectivo esperado y el siguiente turno.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashClosureRequest"
      responses:
        "200":
          description: Cierre registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashClosure"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/invoices:
    get:
      summary: Listar facturas
      responses:
        "200":
          description: Lista de facturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /api/v1/bookings/{id}/invoice:
    get:
      summary: Obtener factura de una reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Factura de reserva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}/payments:
    get:
      summary: Listar pagos registrados de una reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cobros registrados para la reserva
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentEntry"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Registrar un cobro parcial o total para una reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBookingPaymentRequest"
      responses:
        "200":
          description: Cobro registrado y factura actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}/settle-payment:
    post:
      summary: Liquidar y cobrar una reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleBookingPaymentRequest"
      responses:
        "200":
          description: Factura liquidada y cobrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/housekeeping/dirty:
    get:
      summary: Listar habitaciones sucias
      responses:
        "200":
          description: Habitaciones pendientes de limpieza
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /api/v1/housekeeping/board:
    get:
      summary: Tablero operativo de housekeeping
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tablero operativo por estado y salidas del dia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingBoard"
  /api/v1/housekeeping/{id}/start:
    post:
      summary: Iniciar limpieza
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Limpieza iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/v1/housekeeping/{id}/finish:
    post:
      summary: Finalizar limpieza
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Limpieza finalizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/v1/housekeeping/{id}/maintenance:
    post:
      summary: Derivar habitación a mantenimiento
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkMaintenanceRequest"
      responses:
        "200":
          description: Habitación bloqueada por mantenimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceCase"
  /api/v1/housekeeping/{id}/dirty:
    post:
      summary: Devolver habitación a cola de limpieza
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveMaintenanceRequest"
      responses:
        "200":
          description: Habitación devuelta a estado Dirty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceCase"
  /api/v1/reports/revenue:
    get:
      summary: Reporte de ingresos
