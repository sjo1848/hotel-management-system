openapi: 3.0.3
info:
  title: HMS Elite API
  version: 1.0.0
  description: API v1 para HMS Elite (auth, rooms, bookings, guests, users).
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/refresh:
    post:
      summary: Refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      summary: Logout
      responses:
        "200":
          description: Logout exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/me:
    get:
      summary: Datos del usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /rooms:
    get:
      summary: Listar habitaciones
      responses:
        "200":
          description: Lista de habitaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /rooms/available:
    get:
      summary: Buscar disponibilidad
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Habitaciones disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /bookings:
    get:
      summary: Listar reservas
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "200":
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /bookings/{id}:
    patch:
      summary: Actualizar reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /guests:
    get:
      summary: Listar huéspedes
      responses:
        "200":
          description: Lista de huéspedes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear huésped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRequest"
      responses:
        "200":
          description: Huésped creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /users:
    get:
      summary: Listar usuarios (admin)
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear usuario (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  responses:
    ErrorResponse:
      description: Error estándar
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        role:
          type: string
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_number:
          type: string
        room_type:
          type: string
        status:
          type: string
        price_cents:
          type: integer
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        guest_name:
          type: string
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        total_price_cents:
          type: integer
        status:
          type: string
    CreateBookingRequest:
      type: object
      required: [room_id, guest_name, check_in, check_out]
      properties:
        room_id:
          type: string
          format: uuid
        guest_name:
          type: string
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
    UpdateBookingRequest:
      type: object
      properties:
        guest_name:
          type: string
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        status:
          type: string
    Guest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
    CreateGuestRequest:
      type: object
      required: [full_name, email]
      properties:
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
