openapi: 3.0.3
info:
  title: HMS Elite API
  version: 1.0.0
  description: API v1 para HMS Elite (auth, rooms, bookings, guests, users).
servers:
  - url: http://localhost:3001
    description: Local development
security:
  - cookieAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      summary: Refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: Logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout exitoso
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/me:
    get:
      summary: Datos del usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms:
    get:
      summary: Listar habitaciones
      responses:
        "200":
          description: Lista de habitaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear habitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Habitación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/available:
    get:
      summary: Buscar disponibilidad
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Habitaciones disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/{id}:
    get:
      summary: Obtener habitación por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Habitación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings:
    get:
      summary: Listar reservas
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "200":
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/page:
    get:
      summary: Listar reservas paginadas (keyset)
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPageResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}:
    patch:
      summary: Actualizar reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/guests:
    get:
      summary: Listar huéspedes
      responses:
        "200":
          description: Lista de huéspedes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear huésped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRequest"
      responses:
        "200":
          description: Huésped creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/guests/page:
    get:
      summary: Listar huéspedes paginados (keyset)
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Página de huéspedes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPageResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/users:
    get:
      summary: Listar usuarios (admin)
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Crear usuario (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/users/{id}:
    delete:
      summary: Eliminar usuario (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/hotels:
    get:
      summary: Listar hoteles (SaaS)
      responses:
        "200":
          description: Lista de hoteles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hotel"
    post:
      summary: Crear hotel (SaaS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHotelRequest"
      responses:
        "200":
          description: Hotel creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/rooms/{id}/status:
    patch:
      summary: Actualizar estado de habitación
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum:
                      - AVAILABLE
                      - OCCUPIED
                      - DIRTY
                      - MAINTENANCE
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}/extra-charges:
    get:
      summary: Listar cargos extra por reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cargos extra
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtraCharge"
    post:
      summary: Agregar cargo extra a reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExtraChargeRequest"
      responses:
        "200":
          description: Cargo extra agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraCharge"
  /api/v1/analytics/kpis:
    get:
      summary: KPI de dashboard
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"
  /api/v1/audit/events:
    get:
      summary: Eventos de auditoría recientes del tenant
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Eventos de auditoría recientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /api/v1/audit/events/page:
    get:
      summary: Eventos de auditoría paginados (keyset)
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Página de eventos de auditoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPageResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/billing/balance:
    get:
      summary: Balance actual de caja
      responses:
        "200":
          description: Balance actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingBalance"
  /api/v1/billing/close-cash:
    post:
      summary: Cierre de caja
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Cierre registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashClosure"
  /api/v1/invoices:
    get:
      summary: Listar facturas
      responses:
        "200":
          description: Lista de facturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /api/v1/invoices/page:
    get:
      summary: Listar facturas paginadas (keyset)
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Página de facturas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePageResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bookings/{id}/invoice:
    get:
      summary: Obtener factura de una reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Factura de reserva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/housekeeping/dirty:
    get:
      summary: Listar habitaciones sucias
      responses:
        "200":
          description: Habitaciones pendientes de limpieza
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /api/v1/housekeeping/{id}/start:
    post:
      summary: Iniciar limpieza
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Limpieza iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/v1/housekeeping/{id}/finish:
    post:
      summary: Finalizar limpieza
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Limpieza finalizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/v1/reports/revenue:
    get:
      summary: Reporte de ingresos
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Reporte de ingresos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueReport"
  /api/v1/reports/occupancy:
    get:
      summary: Reporte de ocupación
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Reporte de ocupación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OccupancyReport"
  /api/v1/telemetry/ui:
    post:
      summary: Ingesta de eventos de telemetría UI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UiTelemetryEventRequest"
      responses:
        "200":
          description: Evento aceptado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  responses:
    ErrorResponse:
      description: Error estándar
      headers:
        x-api-version:
          schema:
            type: string
          description: Versión de contrato de API.
        x-api-deprecation-policy:
          schema:
            type: string
          description: Política de compatibilidad/deprecación del contrato.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
    LoginRequest:
      type: object
      required: [hotel_id, username, password]
      properties:
        hotel_id:
          type: string
        username:
          type: string
        password:
          type: string
        device_id:
          type: string
          description: Identificador estable del dispositivo/sesión cliente.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
        all_devices:
          type: boolean
          description: Si es true en logout, revoca sesiones de todos los dispositivos.
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        role:
          type: string
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_number:
          type: string
        room_type:
          type: string
        status:
          type: string
          enum:
            - Available
            - Occupied
            - Dirty
            - Cleaning
            - Maintenance
        price_cents:
          type: integer
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        guest_name:
          type: string
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        total_price_cents:
          type: integer
        status:
          type: string
          enum:
            - Confirmed
            - CheckedIn
            - CheckedOut
            - Cancelled
    Hotel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
    ExtraCharge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        description:
          type: string
        amount_cents:
          type: integer
        category:
          type: string
        created_at:
          type: string
          format: date-time
    BookingAlert:
      type: object
      additionalProperties: false
      required:
        - booking_id
        - guest_name
        - room_number
        - status
      properties:
        booking_id:
          type: string
          format: uuid
        guest_name:
          type: string
        room_number:
          type: string
        status:
          type: string
          enum:
            - Confirmed
            - CheckedIn
            - CheckedOut
            - Cancelled
    DashboardKpis:
      type: object
      additionalProperties: false
      required:
        - revenue_month_cents
        - occupancy_rate
        - today_check_ins
        - active_bookings_count
        - arrivals_today
        - departures_today
        - rev_par_cents
        - adr_cents
      properties:
        revenue_month_cents:
          type: integer
        occupancy_rate:
          type: number
          format: double
        today_check_ins:
          type: integer
        active_bookings_count:
          type: integer
        arrivals_today:
          type: array
          items:
            $ref: "#/components/schemas/BookingAlert"
        departures_today:
          type: array
          items:
            $ref: "#/components/schemas/BookingAlert"
        rev_par_cents:
          type: integer
        adr_cents:
          type: integer
    BillingBalance:
      type: object
      properties:
        total_amount_cents:
          type: integer
        cash_amount_cents:
          type: integer
        card_amount_cents:
          type: integer
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        amount_cents:
          type: integer
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - VOIDED
        payment_method:
          type: string
          enum:
            - CASH
            - CARD
            - TRANSFER
        created_at:
          type: string
          format: date-time
    CashClosure:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        total_amount_cents:
          type: integer
        cash_amount_cents:
          type: integer
        card_amount_cents:
          type: integer
        opening_time:
          type: string
          format: date-time
        closing_time:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
    RevenueReport:
      type: object
      additionalProperties: false
      required:
        - date
        - revenue_cents
      properties:
        date:
          type: string
          format: date
        revenue_cents:
          type: integer
    OccupancyReport:
      type: object
      additionalProperties: false
      required:
        - date
        - occupied_rooms
        - total_rooms
        - occupancy_rate
      properties:
        date:
          type: string
          format: date
        occupied_rooms:
          type: integer
        total_rooms:
          type: integer
        occupancy_rate:
          type: number
          format: double
    BookingPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    GuestPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Guest"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    InvoicePageResponse:
      type: object
      properties:
        items:
          type: array
          items:
