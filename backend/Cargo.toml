[package]
name = "hms-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Servidor y Asincronía
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialización y Tiempos
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Base de Datos (Postgres + UUID + Chrono)
# Importante: Todo en una sola declaración
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

# Middleware y Utilidades
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
tower-governor = "0.4"
base64 = "0.22"
