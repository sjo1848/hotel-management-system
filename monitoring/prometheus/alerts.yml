groups:
  - name: hms-backend-alerts
    rules:
      - alert: HMSBackendDown
        expr: up{job="hms-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HMS backend está caído"
          description: "Prometheus no puede scrapear backend:3001 por más de 2 minutos."

      - alert: HMSHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{path!="/health",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{path!="/health"}[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores 5xx"
          description: "La tasa de 5xx supera el 5% en los últimos 5 minutos."

      - alert: HMSP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, path) (rate(http_request_duration_seconds_bucket{path!="/health"}[5m]))
          ) > 1.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia P95 elevada"
          description: "P95 > 1s sostenido por 10 minutos en endpoints de negocio."

      - alert: HMSUiTelemetryIngestionGap
        expr: |
          sum(rate(http_requests_total{path="/api/v1/analytics/kpis",status=~"2.."}[15m])) > 0
          and
          sum(rate(ui_telemetry_events_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sin eventos de telemetría UI"
          description: "Hay tráfico de dashboard pero no se están ingiriendo eventos ui_telemetry_events_total."

      - alert: HMSCloseCashFailureRateHigh
        expr: |
          (
            sum(rate(ui_telemetry_events_total{event="close_cash_failure"}[30m]))
            /
            clamp_min(sum(rate(ui_telemetry_events_total{event=~"close_cash_success|close_cash_failure"}[30m])), 0.000001)
          ) > 0.30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de fallos en cierre de caja (UI)"
          description: "Más del 30% de eventos close_cash son failure en los últimos 30 minutos."

      - alert: HMSAuthLoginFailureRateHigh
        expr: |
          (
            sum(rate(http_requests_total{path="/api/v1/auth/login",status=~"401|403|429"}[10m]))
            /
            clamp_min(sum(rate(http_requests_total{path="/api/v1/auth/login"}[10m])), 1)
          ) > 0.35
        for: 10m
        labels:
          severity: critical
          owner: security
          runbook: docs/ops/runbooks/auth-anomaly-cross-tenant.md
        annotations:
          summary: "Anomalía auth: alta tasa de fallo en login"
          description: "Más del 35% de requests /api/v1/auth/login terminan en 401/403/429 durante 10m."

      - alert: HMSAuthRefreshUnauthorizedSpike
        expr: |
          sum(rate(http_requests_total{path="/api/v1/auth/refresh",status="401"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          owner: security
          runbook: docs/ops/runbooks/auth-anomaly-cross-tenant.md
        annotations:
          summary: "Anomalía auth: spike de refresh no autorizado"
          description: "Tasa de 401 en /api/v1/auth/refresh por encima de 0.5 req/s sostenida 5m."

      - alert: HMSCrossTenantForbiddenSpike
        expr: |
          sum(rate(http_requests_total{path=~"/api/v1/(bookings|rooms|users|guests).*",status="403"}[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
          owner: security
          runbook: docs/ops/runbooks/auth-anomaly-cross-tenant.md
        annotations:
          summary: "Posible intento de acceso cross-tenant"
          description: "Aumento sostenido de 403 en endpoints tenant-scoped críticos (bookings/rooms/users/guests)."
